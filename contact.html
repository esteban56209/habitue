<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Habitué</title>
<meta name="description" content="Contactez l'équipe Habitué.">

<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top" id="top"></header>
<main>
<section class="section"><div class="wrap narrow"><div class="card">
  <h1 style="font-size:1.8rem">Contact</h1>
  <p class="muted">Une question, un problème, une idée ? Écris-nous, on répond par e-mail.</p>
  <form id="f" novalidate>
    <label for="name">Nom</label><input id="name" maxlength="80" autocomplete="name" required>
    <label for="email">E-mail</label><input id="email" type="email" maxlength="120" autocomplete="email" required>
    <label for="message">Message</label><textarea id="message" maxlength="2000" required></textarea>
    <div id="msg" class="msg hidden" role="alert"></div>
    <button class="btn block" id="go" style="margin-top:18px">Envoyer</button>
  </form>
  <p class="small muted hidden" id="direct" style="margin-top:14px"></p>
</div></div></section>
</main>
<footer class="foot" id="foot"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
if (H.cfg.CONTACT_EMAIL) { const d = H.$("#direct"); d.classList.remove("hidden");
  d.innerHTML = `Ou directement par e-mail : <a href="mailto:${H.esc(H.cfg.CONTACT_EMAIL)}">${H.esc(H.cfg.CONTACT_EMAIL)}</a>`; }
H.$("#f").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!H.sb) return H.show("#msg", "Site non configuré.");
  H.busy(H.$("#go"), true);
  const { error } = await H.sb.rpc("submit_contact", { p_name: H.$("#name").value, p_email: H.$("#email").value, p_message: H.$("#message").value });
  H.busy(H.$("#go"), false);
  if (error) return H.show("#msg", H.fr(error));
  H.$("#f").reset(); H.show("#msg", "Message envoyé. Merci, on te répond rapidement.", "ok");
});
</script>
</body>
</html>
