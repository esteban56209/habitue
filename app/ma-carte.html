<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma carte — Habitué</title>
<meta name="description" content="Réglage de la carte de fidélité et QR code.">
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header class="top" id="top"></header>
<main>
<section class="section"><div class="wrap">
  <h1 style="font-size:2rem" class="no-print" id="title">Ma carte</h1>
  <p class="lead no-print hidden" id="setup-intro">Bienvenue ! Il reste une étape : régler ta carte de fidélité.</p>
  <div class="grid c2" style="margin-top:16px;align-items:start">
    <div class="card no-print">
      <form id="f" novalidate>
        <label for="business">Nom du commerce</label>
        <input id="business" maxlength="80" required placeholder="Boulangerie Martin">
        <label for="required">Nombre de tampons pour la récompense</label>
        <input id="required" type="number" min="3" max="20" value="10" inputmode="numeric" required>
        <label for="reward">Récompense</label>
        <input id="reward" maxlength="80" required placeholder="1 café offert">
        <div id="pin-block">
          <label for="pin">Code PIN (4 à 6 chiffres)</label>
          <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off">
          <div class="hint">Tu le taperas sur le téléphone du client pour valider un tampon. Ne le donne à personne.</div>
        </div>
        <label class="row" style="font-weight:600" id="active-row"><input id="active" type="checkbox" checked style="width:22px;min-height:22px"> Carte active</label>
        <div id="msg" class="msg hidden" role="alert"></div>
        <button class="btn block" id="go" style="margin-top:16px">Enregistrer</button>
      </form>
    </div>
    <div class="card poster hidden" id="poster">
      <h2 id="p-name"></h2>
      <p class="big-ok" style="color:var(--green)">Scannez pour votre carte de fidélité</p>
      <canvas id="qr" width="480" height="480" aria-label="QR code de la carte"></canvas>
      <p id="p-reward" style="font-weight:700;margin-top:12px"></p>
      <p class="small muted print-only">Sans application · Propulsé par Habitué</p>
      <div class="actions no-print" style="justify-content:center">
        <button class="btn" id="print" type="button">Imprimer l'affiche</button>
        <a class="btn ghost" id="download" download="qr-code-habitue.png">Télécharger le QR code</a>
      </div>
      <p class="small muted no-print" style="margin-top:14px;word-break:break-all">Lien de la carte : <a id="link" target="_blank" rel="noopener"></a></p>
    </div>
  </div>
</div></section>
</main>
<footer class="foot" id="foot"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="../js/config.js"></script>
<script src="../js/common.js"></script>
<script>
function drawQr(text) {
  const canvas = H.$("#qr"), g = canvas.getContext("2d");
  if (typeof qrcode !== "function") { H.show("#msg", "Le QR code n'a pas pu être généré (connexion ?). Recharge la page."); return; }
  const qr = qrcode(0, "M"); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), cell = Math.floor(canvas.width / (n + 2)), off = Math.floor((canvas.width - cell * n) / 2);
  g.fillStyle = "#fff"; g.fillRect(0, 0, canvas.width, canvas.height); g.fillStyle = "#14532D";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) g.fillRect(off + c * cell, off + r * cell, cell, cell);
  H.$("#download").href = canvas.toDataURL("image/png");
}
function showPoster(m, card) {
  H.$("#poster").classList.remove("hidden");
  H.$("#p-name").textContent = m.business_name;
  H.$("#p-reward").textContent = "🎁 " + card.stamps_required + " tampons = " + card.reward;
  const url = H.cardUrl(card.id);
  H.$("#link").textContent = url; H.$("#link").href = url;
  drawQr(url);
}
let isSetup = false;
(async () => {
  const ctx = await H.requireMerchant({ allowSetup: true }); if (!ctx) return;
  isSetup = !ctx.merchant || !ctx.card;
  if (isSetup) {
    H.$("#title").textContent = "Créer ma carte";
    H.$("#setup-intro").classList.remove("hidden");
    H.$("#active-row").classList.add("hidden");
  } else {
    H.$("#business").value = ctx.merchant.business_name;
    H.$("#required").value = ctx.card.stamps_required;
    H.$("#reward").value = ctx.card.reward;
    H.$("#active").checked = ctx.card.active;
    H.$("#pin-block").classList.add("hidden");
    showPoster(ctx.merchant, ctx.card);
  }
})();
H.$("#f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pin = isSetup ? H.$("#pin").value : "";
  if (isSetup && !/^[0-9]{4,6}$/.test(pin)) return H.show("#msg", "Le code PIN doit contenir 4 à 6 chiffres.");
  H.busy(H.$("#go"), true);
  const { error } = await H.sb.rpc("save_merchant", {
    p_business_name: H.$("#business").value, p_pin: pin,
    p_stamps_required: parseInt(H.$("#required").value, 10) || 0,
    p_reward: H.$("#reward").value, p_active: H.$("#active").checked });
  H.busy(H.$("#go"), false);
  if (error) return H.show("#msg", H.fr(error));
  if (isSetup) { location.href = "ma-carte.html"; return; }
  const ctx = await H.requireMerchant(); if (!ctx) return;
  showPoster(ctx.merchant, ctx.card);
  H.show("#msg", "Carte enregistrée.", "ok");
});
H.$("#print").addEventListener("click", () => window.print());
</script>
</body>
</html>
