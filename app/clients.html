<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes clients — Habitué</title>
<meta name="description" content="Liste des clients fidèles.">
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/style.css">

</head>
<body>
<header class="top" id="top"></header>
<main>
<section class="section"><div class="wrap">
  <h1 style="font-size:2rem">Mes clients</h1>
  <div id="msg" class="msg hidden" role="alert"></div>
  <div class="card">
    <input id="q" type="search" placeholder="Rechercher un prénom, un téléphone, un e-mail" aria-label="Rechercher un client">
    <div class="table-wrap" style="margin-top:12px"><table>
      <thead><tr><th>Prénom</th><th>Contact</th><th>Tampons</th><th>Récompenses</th><th>Dernier passage</th><th>Inscrit le</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="muted">Chargement…</td></tr></tbody>
    </table></div>
    <p class="small muted" style="margin-top:12px">Un client peut te demander la suppression de ses données : utilise le bouton « Supprimer ».</p>
  </div>
</div></section>
</main>
<footer class="foot" id="foot"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/common.js"></script>
<script>
let all = [], required = 0, pending = null;
function render() {
  const q = H.$("#q").value.trim().toLowerCase();
  const list = all.filter((c) => !q || (c.first_name + " " + c.contact).toLowerCase().includes(q));
  H.$("#rows").innerHTML = list.length ? list.map((c) => `<tr>
    <td>${H.esc(c.first_name)}</td><td>${H.esc(c.contact)}</td><td>${c.stamps} / ${required}</td><td>${c.rewards_earned}</td>
    <td>${H.dateTime(c.last_visit_at)}</td><td>${H.date(c.created_at)}</td>
    <td>${pending === c.id
      ? `<button class="btn small danger" data-confirm="${c.id}">Confirmer</button> <button class="btn small ghost" data-cancel="1">Annuler</button>`
      : `<button class="btn small ghost" data-del="${c.id}">Supprimer</button>`}</td></tr>`).join("")
    : `<tr><td colspan="7" class="muted">${all.length ? "Aucun client ne correspond." : "Aucun client inscrit pour l'instant."}</td></tr>`;
}
async function load() {
  const { data, error } = await H.sb.from("customers")
    .select("id,first_name,contact,stamps,rewards_earned,last_visit_at,created_at").order("created_at", { ascending: false }).limit(1000);
  if (error) return H.show("#msg", H.fr(error));
  all = data || []; render();
}
(async () => { const ctx = await H.requireMerchant(); if (!ctx) return; required = ctx.card.stamps_required; load(); })();
H.$("#q").addEventListener("input", render);
H.$("#rows").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.del) { pending = b.dataset.del; return render(); }
  if (b.dataset.cancel) { pending = null; return render(); }
  if (b.dataset.confirm) {
    const { error } = await H.sb.from("customers").delete().eq("id", b.dataset.confirm);
    pending = null;
    if (error) return H.show("#msg", H.fr(error));
    H.show("#msg", "Client supprimé.", "ok"); load();
  }
});
</script>
</body>
</html>
