<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Créer un compte — Habitué</title>
<meta name="description" content="Créez votre compte commerçant Habitué.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">

</head>
<body>
<header class="top" id="top"></header>
<main>
<section class="section"><div class="wrap narrow"><div class="card">
  <h1 style="font-size:1.8rem">Créer mon compte</h1>
  <p class="muted">Gratuit, sans carte bancaire.</p>
  <form id="f" novalidate>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="password">Mot de passe</label>
    <input id="password" type="password" autocomplete="new-password" minlength="8" required>
    <div class="hint">8 caractères minimum.</div>
    <div id="msg" class="msg hidden" role="alert"></div>
    <button class="btn block" id="go" style="margin-top:20px">Créer mon compte</button>
  </form>
  <p class="small muted" style="margin-top:16px">En créant un compte, vous acceptez notre <a href="confidentialite.html">politique de confidentialité</a>.</p>
  <p class="small">Déjà un compte ? <a href="connexion.html">Se connecter</a></p>
</div></div></section>
</main>
<footer class="foot" id="foot"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
H.$("#f").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!H.sb) return H.show("#msg", "Site non configuré.");
  const email = H.$("#email").value.trim(), password = H.$("#password").value;
  if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(email)) return H.show("#msg", "Entre une adresse e-mail valide.");
  if (password.length < 8) return H.show("#msg", "Le mot de passe doit contenir au moins 8 caractères.");
  H.busy(H.$("#go"), true);
  const { data, error } = await H.sb.auth.signUp({ email, password,
    options: { emailRedirectTo: new URL("app/ma-carte.html", location.href).href } });
  H.busy(H.$("#go"), false);
  if (error) return H.show("#msg", H.fr(error));
  if (data.session) { location.href = "app/ma-carte.html"; return; }
  H.$("#f").reset();
  H.show("#msg", "Compte créé. Ouvre l'e-mail que nous venons de t'envoyer et clique sur le lien pour l'activer.", "ok");
});
</script>
</body>
</html>
